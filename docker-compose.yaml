# Docker compose for the cmd-hub ui-app + scraper-node example.
#
# Mongo and Ollama run on the host (default ports). Containers reach them
# via host.docker.internal — on Linux this name resolves through the
# `host.docker.internal:host-gateway` extra_hosts entry below.
#
# Usage: docker compose up --build

services:
  cmd-hub:
    build:
      context: .
      dockerfile: examples/ui-app/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./examples/ui-app/config.docker.json:/config/config.json:ro
    ports:
      - "50051:50051"
      - "8081:8081"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  scraper-node:
    build:
      context: .
      dockerfile: examples/scraper-node/Dockerfile
    depends_on:
      - cmd-hub
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./examples/scraper-node/config.docker.json:/config/config.json:ro
    ports:
      - "50061:50061"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
